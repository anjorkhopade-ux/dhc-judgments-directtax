name: Test fetch orders
on:
  workflow_dispatch:
jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      TEST_LIMIT: "5"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Fetch orders
        run: python scraper.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orders
          path: orders/
          if-no-files-found: warn
