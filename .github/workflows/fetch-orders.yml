name: Fetch Delhi HC orders
on:
  schedule:
    - cron: "30 3,8,12 * * *"
  workflow_dispatch:
    inputs:
      test_limit:
        description: "Max orders per judge (0 = all)"
        default: "0"
permissions:
  contents: write
concurrency:
  group: fetch-orders
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      TEST_LIMIT: ${{ inputs.test_limit || '0' }}
      DRIVE_URL: ${{ secrets.DRIVE_URL }}
      DRIVE_SECRET: ${{ secrets.DRIVE_SECRET }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pypdf
      - name: Fetch orders
        run: python scraper.py
      - name: Remember which orders are saved
        if: always()
        run: |
          git config user.name "orders-bot"
          git config user.email "orders-bot@users.noreply.github.com"
          git add downloaded.json || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "Update list of saved orders"
          git pull --rebase
          git push
      - name: Tell Make.com the run has finished
        if: always()
        env:
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
        run: |
          if [ -n "$MAKE_WEBHOOK_URL" ]; then
            curl -sS -X POST -H "Content-Type: application/json" \
              -d '{"event": "run_finished", "run": "${{ github.run_number }}"}' \
              "$MAKE_WEBHOOK_URL" || true
          fi
